lead: >-
  AEF is an independent film production company operating between Rome and
  London, founded in 2022 by writer-producer Matteo Severini and
  director-producer Riccardo Rizzi.
body:
  - Conceived as both a creative and industrial platform, AEF approaches cinema as a collaborative system in which authorship, labor, and value are inseparable.
  - Working across development, production, and distribution, the company is committed to building projects that are formally rigorous, culturally resonant, and structurally independent. Its slate spans narrative, hybrid, and non-fiction forms, with a focus on voices that challenge conventional modes of storytelling while remaining attentive to audience and market realities.
  - "At the core of AEF lies a rethinking of the production model itself: a transparent, participation-driven framework that aligns the interests of creators, collaborators, and partners. By integrating artistic intent with sustainable practices, AEF aims not only to produce films, but to construct an ecosystem in which the value generated by a work is more equitably shared and where cinema can continue to evolve as both an art form and a living industry."
