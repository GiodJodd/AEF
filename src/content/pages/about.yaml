lead: >-
  AEF is an independent film production company operating between Rome and
  London, founded in 2022 by writer-producer Matteo Severini and
  director-producer Riccardo Rizzi.
body:
  - >-
    Conceived as both a creative and industrial platform, AEF approaches cinema
    as a collaborative system blending authorship, labor, and value.
  - >-
    From development to production, the company is committed to building
    narrative, hybrid, and non-fiction projects with a focus on voices that
    challenge conventional modes of storytelling while remaining attentive to
    audience and market realities.
  - >-
    At the core of AEF lies a rethinking of the production model itself: a
    transparent, participation-driven framework that aligns the interests of
    creators, collaborators, and partners. By integrating artistic intent with
    sustainable practices, AEF aims to construct an ecosystem where presence is
    a method, not a courtesy. 
