logline: >-
  A modern-day fairytale rooted in Nordic landscape and myth, where an interplay
  of light and darkness portrays nature as both formidable and sacred.
synopsis: |-
  The modern-day fairytale short film "Kiss of An Angel" draws inspiration from Nordic landscapes, ancient myth, and timeless bygone fairytales. Rooted in a distinctly Scandinavian sensibility, the film seeks to evoke an ethereal and magical atmosphere shaped by an intimate dialogue between light and darkness — an interplay that reflects both the natural world and the inner human experience.

  Through music, movement, and elemental imagery, it portrays nature as both formidable and sacred — a force that demands respect yet offers profound healing.

  "Kiss of an Angel" is to be screened as part of British Art Fair 2026 at the Saatchi Gallery, London.
