logline: >-
  A young woman and her new friends awaken a supernatural presence after a
  careless ritual, and reality blurs into nightmare.
synopsis: |-
  A mysterious event in the past sets in motion a dark force tied to an ancient secret.

  In the present day, a young woman moves to the city seeking a fresh start. She becomes involved with a group of friends whose carefree choices lead them to a strange discovery. After performing a ritual, they unknowingly awaken a supernatural presence.

  Disturbing visions and paranoia begin to consume them. In search of answers, they venture into an unfamiliar and ominous place. There, reality shifts and they find themselves trapped in a hostile environment. As fear grows, the group begins to fall apart under pressure.

  This encounter leaves a lasting impact, blurring the line between nightmare and reality.
