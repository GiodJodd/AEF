logline: >-
  A struggling young actor and a solitary American archaeologist meet on a
  restless Roman night, and an unlikely encounter becomes an intimate
  excavation of healing.
synopsis: |-
  Set against the blistering heat of Rome, this debut feature by director Riccardo Rizzi is drawn from a true story originating from a personal confession and brought to the screen by its real-life protagonists, who portray themselves.

  Simone, a struggling young actor drifting between auditions, and Karen, an aging American archaeologist worn down by solitude, meet on a restless night. What begins as a raw, physical connection soon evolves into something far more unexpected.

  As desire gives way to vulnerability, two lives shaped by distance, time, and disillusion begin to converge. In a city layered with history and decay, their relationship becomes an intimate excavation, uncovering the fragile, often uncomfortable truth that even the most unlikely encounters can lead to healing.
