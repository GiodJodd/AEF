logline: >-
  A young woman marked by depression and loss returns each week to a beach tied
  to a traumatic memory, in an intimate portrait of guilt and rebirth.
synopsis: |-
  Maree is the intimate portrait of Carla, a young woman marked by deep depression following her partner's abandonment, which also cost her custody of her daughter Beatrice — raised by her sister Alba.

  Trying to rebuild her life, Carla clings to a new job and a therapeutic journey that brings her back each week to a beach tied to a traumatic memory: a fire that destroyed a house and permanently fractured her family. Behind that tragedy lies a secret Carla chooses to keep silent, taking on blame that isn't hers.

  Between guilt and the desire for redemption, her slow re-emergence intertwines with the fragile possibility of rebuilding a bond with her daughter. A visceral story about motherhood, guilt, and the possibility of rebirth.
